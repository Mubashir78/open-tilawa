name: Extension pages

# Privacy and terms for the store listings, served by GitHub Pages from this
# folder only. Nothing here is built, and nothing else in the repo is published.
on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/extension/site/**'
      - '.github/workflows/extension-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: extension-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/extension/site
      - id: deployment
        uses: actions/deploy-pages@v4
